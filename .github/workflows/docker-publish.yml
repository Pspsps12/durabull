name: Docker Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Smoke Test, Build & Publish Image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build smoke-test image
        run: docker build -f tooling/docker/Dockerfile -t durabull-release:${{ github.sha }} .

      - name: Smoke test self-hosted image
        run: bash tooling/scripts/docker-image-smoke.sh
        env:
          DURABULL_IMAGE: durabull-release:${{ github.sha }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@v1

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./tooling/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64

  trigger-cloud-deploy-hook:
    name: Trigger Cloud Deploy Hook
    runs-on: blacksmith-4vcpu-ubuntu-2404
    needs: docker
    if: success() && github.event_name == 'push'
    steps:
      - name: Validate deploy hook secret
        run: |
          if [ -z "${{ secrets.CLOUD_DEPLOY_HOOK_URL }}" ]; then
            echo "CLOUD_DEPLOY_HOOK_URL secret must be configured."
            exit 1
          fi

      - name: POST deploy hook
        env:
          CLOUD_DEPLOY_HOOK_URL: ${{ secrets.CLOUD_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --request POST \
            --header "Content-Type: application/json" \
            --data "{\"repository\":\"${{ github.repository }}\",\"ref\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\"}" \
            "$CLOUD_DEPLOY_HOOK_URL"
