name: Update Homebrew Cask

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  update-cask:
    name: Update Homebrew tap
    runs-on: macos-latest
    if: "!github.event.release.prerelease"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for macOS DMG asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="Durabull-${VERSION}-arm64.dmg"

          for attempt in {1..60}; do
            if gh release download "$GITHUB_REF_NAME" --pattern "$ASSET" --dir /tmp 2>/dev/null; then
              echo "Downloaded $ASSET"
              exit 0
            fi
            echo "Attempt $attempt: $ASSET not available yet, retrying in 10s..."
            sleep 10
          done

          echo "::error::$ASSET was not available after 10 minutes"
          exit 1

      - name: Compute SHA256
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA=$(shasum -a 256 "/tmp/Durabull-${VERSION}-arm64.dmg" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Clone homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/durabullhq/homebrew-tap.git" /tmp/homebrew-tap

      - name: Update cask formula
        run: |
          VERSION="${{ steps.sha.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          mkdir -p /tmp/homebrew-tap/Casks
          sed -e "s/version \".*\"/version \"${VERSION}\"/" \
              -e "s/sha256 \".*\"/sha256 \"${SHA}\"/" \
              tooling/homebrew/durabull.rb > /tmp/homebrew-tap/Casks/durabull.rb

      - name: Push to homebrew-tap
        working-directory: /tmp/homebrew-tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.sha.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/durabull.rb
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update durabull to ${VERSION}"
          git push
