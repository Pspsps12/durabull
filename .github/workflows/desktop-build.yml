name: Desktop Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  BUN_VERSION: "1.3.5"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and publish native release
        if: github.event_name == 'push'
        run: bun run --filter @durabull/desktop dist:publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build native app bundle
        if: github.event_name == 'workflow_dispatch'
        run: bun run --filter @durabull/desktop dist:dir

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: durabull-desktop-${{ runner.os }}
          path: apps/desktop/release/**
          if-no-files-found: error
