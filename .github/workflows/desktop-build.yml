name: Desktop Builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  BUN_VERSION: "1.3.5"

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build native release artifacts
        if: github.event_name == 'push'
        run: bun run --filter @durabull/desktop dist

      - name: Wait for GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in {1..24}; do
            if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              exit 0
            fi

            sleep 5
          done

          echo "GitHub release ${GITHUB_REF_NAME} was not available in time." >&2
          exit 1

      - name: Upload desktop assets to GitHub release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" apps/desktop/release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

      - name: Build native app bundle
        if: github.event_name == 'workflow_dispatch'
        run: bun run --filter @durabull/desktop dist:dir

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: durabull-desktop-${{ runner.os }}
          path: apps/desktop/release/**
          if-no-files-found: error
